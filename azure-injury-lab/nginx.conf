server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy /api/score => Azure ML endpoint
    location /api/score {
        
        proxy_pass http://c953e64f-4fc1-4e1c-a0d9-c8154f053f60.swedencentral.azurecontainer.io/score;

        proxy_http_version  1.1;
        proxy_set_header    Host        c953e64f-4fc1-4e1c-a0d9-c8154f053f60.swedencentral.azurecontainer.io;
        proxy_set_header    Content-Type $http_content_type;
        proxy_pass_header   Authorization;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout    60s;

        add_header Cache-Control "no-store";
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}